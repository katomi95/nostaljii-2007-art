<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOSTALJII 2007</title>
<meta name="description" content="忘れようとしても、思い出せない。 ― 短編ミステリーADV">
<style>
/* =========================================================
   NOSTALJII 2007  ―  忘れようとしても、思い出せない。
   style.css
   ========================================================= */

:root{
  --ink:      #f2e2ba;
  --ink-dim:  #c2a878;
  --paper:    #15100a;
  --amber:    #e0a94e;
  --brass:    #a8813c;
  --frame:    #6a4e26;
  --shadow:   #0a0704;
  --win-bg:   rgba(20,14,7,.88);
  --icas-bg:  rgba(12,9,5,.90);
  --serif: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --mono: "SF Mono","Consolas","Courier New","Osaka-Mono",monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{
  height:100%;
  background:#070503;
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden;
  overscroll-behavior:none;
}

#cabinet{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 50% 40%, #1d150c 0%, #0a0705 60%, #050302 100%);
  padding:0;
}

/* ---- 画面本体（16:9を維持） ---- */
#screen{
  position:relative;
  width:min(100vw, 170vh);
  height:min(56.25vw, 95.6vh);
  overflow:hidden;
  background:#0d0904;
  border-radius:10px;
  box-shadow:0 0 0 2px #2b1e0e, 0 0 40px rgba(0,0,0,.9), inset 0 0 90px rgba(0,0,0,.75);
  cursor:pointer;
  user-select:none;
  filter:sepia(.42) saturate(.9) contrast(1.04);
}

/* =========================================================
   舞台（背景・立ち絵）
   ========================================================= */
#stage{ position:absolute; left:0; right:0; top:0; height:66%; overflow:hidden; }

#bg{ position:absolute; inset:0; opacity:0; transition:opacity .7s ease; }
#bg.on{ opacity:1; }
#bg svg{ width:100%; height:100%; display:block; }
#bg img{ width:100%; height:100%; display:block; object-fit:cover; }
#bg img.scene-art{ position:absolute; inset:0; opacity:0; transition:opacity .9s ease; object-position:50% 12%; }
#bg img.scene-art.on{ opacity:1; }

#smoke{
  position:absolute; inset:-10%;
  pointer-events:none; opacity:.30;
  background:
    radial-gradient(45% 35% at 20% 70%, rgba(226,203,150,.20), transparent 70%),
    radial-gradient(50% 40% at 78% 40%, rgba(226,203,150,.14), transparent 70%),
    radial-gradient(60% 45% at 45% 90%, rgba(226,203,150,.12), transparent 70%);
  animation:drift 34s ease-in-out infinite alternate;
  mix-blend-mode:screen;
}
@keyframes drift{
  0%  { transform:translate3d(-3%,0,0) scale(1.02); }
  50% { transform:translate3d(2%,-2%,0) scale(1.07); }
  100%{ transform:translate3d(4%,1%,0) scale(1.03); }
}

#portrait{
  position:absolute; left:0; right:0; bottom:0; top:0;
  display:flex; align-items:flex-end; justify-content:center;
  pointer-events:none;
}
#portrait .fig{
  position:absolute; bottom:0; left:50%;
  height:94%;
  opacity:0;
  transform:translate(-50%,14px) scale(.985);
  transition:opacity .55s ease, transform .55s ease;
  filter:drop-shadow(0 0 26px rgba(0,0,0,.75));
}
#portrait .fig.on{ opacity:1; transform:translate(-50%,0) scale(1); }
#portrait .fig.gone{ pointer-events:none; }
#portrait svg{ height:100%; width:auto; display:block; }
/* 一枚絵の人物：暗い背景ごと描かれた胸像の縁をぼかして舞台になじませる */
#portrait .fig.art{ height:100%; filter:none; }
#portrait img{
  height:100%; width:auto; display:block;
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 24%, #000 76%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 10%, #000 88%, transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:
    linear-gradient(to right, transparent 0%, #000 24%, #000 76%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 10%, #000 88%, transparent 100%);
          mask-composite:intersect;
}
#portrait .fig.wide img{
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 10%, #000 88%, transparent 100%);
          mask-image:
    linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 10%, #000 88%, transparent 100%);
}

/* ---- シーンカード ---- */
#scene-card{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(8,5,2,.86);
  opacity:0; pointer-events:none; transition:opacity .6s ease;
  letter-spacing:.22em;
}
#scene-card.on{ opacity:1; }
#scene-card .sc-no{ font-family:var(--mono); font-size:.85rem; color:var(--brass); margin-bottom:.7em; }
#scene-card .sc-ti{ font-size:1.5rem; color:var(--ink); border-top:1px solid var(--frame); border-bottom:1px solid var(--frame); padding:.5em 1.4em; }

/* =========================================================
   I-CAS（心の声）
   ========================================================= */
#icas{
  position:absolute;
  right:1.4%;
  top:3.5%;
  width:24%;
  min-height:16%;
  max-height:56%;
  background:var(--icas-bg);
  border:1px solid var(--frame);
  box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 6px 24px rgba(0,0,0,.7), inset 0 0 30px rgba(224,169,78,.05);
  padding:.45em .6em .3em;
  opacity:0; transform:translateY(-6px);
  transition:opacity .3s ease, transform .3s ease;
  pointer-events:none;
  display:flex; flex-direction:column;
}
#icas.on{ opacity:1; transform:translateY(0); }
#icas.glitch{ animation:icasglitch .34s steps(3) 1; }
@keyframes icasglitch{
  0%  { transform:translate(0,0);   filter:none; }
  30% { transform:translate(-3px,1px); filter:invert(.75) brightness(1.4); }
  60% { transform:translate(2px,-1px); filter:none; }
  100%{ transform:translate(0,0); }
}
.icas-head{
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--frame); padding-bottom:.25em; margin-bottom:.45em;
}
.icas-title{ font-family:var(--mono); font-size:.72rem; letter-spacing:.32em; color:var(--amber); }
.icas-led{
  width:7px; height:7px; border-radius:50%;
  background:var(--amber); box-shadow:0 0 8px var(--amber);
  animation:blink 1.9s steps(1) infinite;
}
@keyframes blink{ 0%,60%{opacity:1} 61%,100%{opacity:.18} }
.icas-body{
  font-family:var(--serif);
  font-size:.95rem; line-height:1.65; color:var(--ink);
  flex:1; overflow:hidden; text-shadow:0 0 6px rgba(224,169,78,.25);
}
.icas-foot{
  font-family:var(--mono); font-size:.52rem; letter-spacing:.14em;
  color:var(--brass); opacity:.6; text-align:right; margin-top:.4em;
  border-top:1px dotted rgba(106,78,38,.6); padding-top:.25em;
}

/* =========================================================
   会話ウィンドウ
   ========================================================= */
#msgwin{
  position:absolute; left:2%; right:2%; bottom:2.4%;
  height:29%;
  background:var(--win-bg);
  border:1px solid var(--frame);
  box-shadow:
    inset 0 0 0 1px rgba(168,129,60,.25),
    inset 0 0 40px rgba(0,0,0,.75),
    0 6px 26px rgba(0,0,0,.65);
  padding:1.05em 1.5em .9em;
  opacity:0; transition:opacity .35s ease;
}
#msgwin.on{ opacity:1; }

#namebox{
  position:absolute; top:-.95em; left:1.3em;
  background:#1b1309; border:1px solid var(--frame);
  padding:.12em 1em; font-size:.92rem; letter-spacing:.14em;
  color:var(--amber); min-height:1.6em;
  box-shadow:0 2px 10px rgba(0,0,0,.6);
}
#namebox:empty{ display:none; }

#msgtext{
  font-size:1.18rem; line-height:1.85; letter-spacing:.03em;
  white-space:pre-wrap; text-shadow:0 0 10px rgba(0,0,0,.8);
  height:100%; overflow:hidden;
}
#msgtext.narration{ color:var(--ink-dim); font-style:normal; letter-spacing:.12em; }

#cursor{
  position:absolute; right:1.1em; bottom:.55em;
  font-size:.85rem; color:var(--amber); opacity:0;
  animation:bob 1.1s ease-in-out infinite;
}
#cursor.on{ opacity:1; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(3px) } }

/* =========================================================
   選択肢
   ========================================================= */
#choices{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:min(62%, 640px);
  display:none; flex-direction:column; gap:.55em;
  z-index:6;
  background:rgba(9,6,3,.92);
  border:1px solid var(--frame);
  padding:1.1em 1.3em;
  box-shadow:0 10px 40px rgba(0,0,0,.8), inset 0 0 40px rgba(0,0,0,.8);
}
#choices.on{ display:flex; animation:cfade .35s ease both; }
@keyframes cfade{ from{opacity:0; transform:translate(-50%,-46%)} to{opacity:1; transform:translate(-50%,-50%)} }
#choices .ch-q{
  font-size:.86rem; letter-spacing:.18em; color:var(--brass);
  text-align:center; margin-bottom:.2em;
}
#choices button{
  font-family:var(--serif);
  font-size:1.06rem; letter-spacing:.1em;
  color:var(--ink);
  background:rgba(26,18,9,.98);
  border:1px solid var(--frame);
  padding:.62em 1.1em;
  cursor:pointer;
  text-align:left;
  transition:background .15s, color .15s, transform .12s;
  box-shadow:inset 0 0 22px rgba(0,0,0,.6);
}
#choices button::before{ content:"▶ "; color:var(--brass); }
#choices button:hover,#choices button:focus-visible{
  background:rgba(224,169,78,.16); color:#fff3d6; transform:translateX(3px); outline:none;
}
#choices button:hover::before{ color:var(--amber); }
#choices.wire button{ text-align:center; letter-spacing:.2em; }
#choices.wire button::before{ content:"✂ "; }

/* =========================================================
   メニュー
   ========================================================= */
#menu{
  position:absolute; right:1.4%; bottom:33%;
  display:none; gap:.4em; z-index:5;
}
#menu.on{ display:flex; }
#menu button{
  font-family:var(--mono); font-size:.62rem; letter-spacing:.12em;
  color:var(--brass); background:rgba(12,8,4,.8);
  border:1px solid rgba(106,78,38,.7); padding:.3em .6em; cursor:pointer;
}
#menu button:hover{ color:var(--amber); border-color:var(--amber); }

/* =========================================================
   オーバーレイ
   ========================================================= */
#fade{
  position:absolute; inset:0; background:#000; opacity:0;
  pointer-events:none; transition:opacity .8s ease; z-index:7;
}
#fade.on{ opacity:1; }
#fade.fast{ transition-duration:.22s; }

#flash{
  position:absolute; inset:0; background:#fff6df; opacity:0;
  pointer-events:none; z-index:8;
}
#flash.go{ animation:flashout .55s ease-out 1; }
@keyframes flashout{ 0%{opacity:.96} 100%{opacity:0} }

#bigtext{
  position:absolute; inset:0; z-index:9;
  display:flex; align-items:center; justify-content:center;
  background:#000; opacity:0; pointer-events:none;
  transition:opacity .25s ease;
  text-align:center; padding:1em;
}
#bigtext.on{ opacity:1; }
#bigtext span{
  font-family:var(--mono); font-weight:bold;
  font-size:clamp(1.1rem, 4.2vw, 2.9rem);
  letter-spacing:.2em; color:#e8d7ac;
  text-shadow:0 0 24px rgba(232,215,172,.35);
  animation:bigglitch .9s steps(2) infinite;
}
@keyframes bigglitch{
  0%,100%{ transform:translate(0,0); opacity:1 }
  48%{ transform:translate(-2px,1px); opacity:.82 }
  52%{ transform:translate(3px,-1px); opacity:1 }
}

/* ---- 揺れ ---- */
.shake{ animation:shake .62s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake{
  10%,90%{ transform:translate3d(-4px,2px,0) }
  20%,80%{ transform:translate3d(7px,-4px,0) }
  30%,50%,70%{ transform:translate3d(-11px,5px,0) }
  40%,60%{ transform:translate3d(11px,-5px,0) }
}
.shake-soft{ animation:shake .38s ease both; }

/* =========================================================
   タイトル画面
   ========================================================= */
#title-screen{
  position:absolute; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 50% 68%, #2a1d0d 0%, #120c06 55%, #070402 100%);
  transition:opacity .8s ease;
}
#title-screen.off{ opacity:0; pointer-events:none; }
.t-ship{
  position:absolute; inset:0;
  background:
    linear-gradient(to bottom, rgba(7,4,2,.35) 0%, rgba(7,4,2,.55) 45%, rgba(0,0,0,.6) 100%),
    url("assets/title_ship.jpg") center 70% / cover no-repeat,
    radial-gradient(60% 26% at 50% 82%, rgba(224,169,78,.09), transparent 70%);
}
.t-ship::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:34%;
  background:repeating-linear-gradient(to bottom, rgba(224,169,78,.05) 0 1px, transparent 1px 7px);
  opacity:.7;
}
.t-inner{ position:relative; text-align:center; padding:1.2em; }
#title-screen h1{
  font-family:var(--mono); font-weight:bold;
  font-size:clamp(1.6rem, 6.2vw, 4.4rem);
  letter-spacing:.16em; color:#f4e4bb;
  text-shadow:0 0 30px rgba(224,169,78,.35), 0 3px 0 #543a17;
  line-height:1.1;
}
.t-year{ display:block; font-size:.46em; letter-spacing:.55em; color:var(--brass); margin-top:.35em; }
.t-copy{
  margin:1.5em 0 2.1em; font-size:clamp(.85rem,1.9vw,1.22rem);
  letter-spacing:.2em; color:var(--ink-dim);
}
.t-menu{ display:flex; flex-direction:column; align-items:center; gap:.6em; }
.t-menu button{
  font-family:var(--mono); font-size:clamp(.8rem,1.5vw,1.05rem); letter-spacing:.34em;
  color:var(--ink); background:transparent;
  border:1px solid var(--frame); padding:.55em 2.6em; cursor:pointer;
  transition:.18s; min-width:12em;
}
.t-menu button:hover:not(:disabled),.t-menu button:focus-visible:not(:disabled){
  background:rgba(224,169,78,.16); color:#fff4d8; border-color:var(--amber); outline:none;
}
.t-menu button:disabled{ opacity:.28; cursor:default; }
.t-note{ margin-top:2em; font-size:.68rem; letter-spacing:.14em; color:var(--brass); opacity:.8; }
.t-credit{ margin-top:.5em; font-family:var(--mono); font-size:.52rem; letter-spacing:.2em; color:var(--brass); opacity:.45; }

/* =========================================================
   CRT効果
   ========================================================= */
#noise{
  position:absolute; inset:0; width:100%; height:100%;
  z-index:11; pointer-events:none; opacity:.075; mix-blend-mode:overlay;
}
#scanlines{
  position:absolute; inset:0; z-index:12; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  opacity:.55;
}
#scanlines::after{
  content:""; position:absolute; left:0; right:0; height:16%;
  background:linear-gradient(to bottom, transparent, rgba(255,240,210,.045), transparent);
  animation:roll 7.5s linear infinite;
}
@keyframes roll{ from{ top:-20% } to{ top:110% } }
#vignette{
  position:absolute; inset:0; z-index:13; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.72) 100%);
}

/* =========================================================
   レスポンシブ
   ========================================================= */
@media (max-width: 900px){
  .icas-body{ font-size:.8rem; line-height:1.55; }
  #msgtext{ font-size:1rem; line-height:1.7; }
  #namebox{ font-size:.8rem; }
}

@media (max-aspect-ratio: 1/1){
  /* 縦持ちスマートフォン：画面いっぱいに */
  #screen{
    width:100vw; height:100dvh; height:100vh; border-radius:0;
  }
  #stage{ height:58%; }
  #icas{
    top:2%; right:2%; width:44%; max-height:36%;
    font-size:.9em;
  }
  #msgwin{ height:30%; bottom:2%; padding:.95em 1em .8em; }
  #msgtext{ font-size:1rem; line-height:1.75; }
  .icas-body{ font-size:.86rem; }
  #portrait .fig{ height:88%; }
  #choices{ width:88%; top:42%; padding:.9em 1em; }
  #choices button{ font-size:.98rem; padding:.7em .9em; }
  #menu{ bottom:33%; }
  #scene-card .sc-ti{ font-size:1.05rem; }
}

@media (max-width: 420px){
  #msgtext{ font-size:.93rem; }
  .icas-body{ font-size:.78rem; }
  .icas-title{ font-size:.62rem; }
  .icas-foot{ display:none; }
}

@media (prefers-reduced-motion: reduce){
  #smoke, #scanlines::after, .icas-led, #cursor{ animation:none; }
}

</style>
</head>
<body>

<div id="cabinet">
  <div id="screen">

    <!-- ===== 舞台 ===== -->
    <div id="stage">
      <div id="bg"></div>
      <div id="smoke"></div>
      <div id="portrait"></div>
      <div id="scene-card"><div class="sc-no"></div><div class="sc-ti"></div></div>
    </div>

    <!-- ===== I-CAS（心の声） ===== -->
    <div id="icas">
      <div class="icas-head">
        <span class="icas-title">I-CAS</span>
        <span class="icas-led"></span>
      </div>
      <div class="icas-body"></div>
      <div class="icas-foot">INNER CHANNEL / ASSOC.SUB</div>
    </div>

    <!-- ===== 会話ウィンドウ ===== -->
    <div id="msgwin">
      <div id="namebox"></div>
      <div id="msgtext"></div>
      <div id="cursor">▼</div>
    </div>

    <!-- ===== 選択肢 ===== -->
    <div id="choices"></div>

    <!-- ===== メニュー ===== -->
    <div id="menu">
      <button id="btn-sound" type="button" title="音">♪ ON</button>
      <button id="btn-title" type="button" title="タイトルへ">TITLE</button>
    </div>

    <!-- ===== オーバーレイ類 ===== -->
    <div id="fade"></div>
    <div id="flash"></div>
    <div id="bigtext"><span></span></div>

    <!-- ===== タイトル画面 ===== -->
    <div id="title-screen">
      <div class="t-ship"></div>
      <div class="t-inner">
        <h1>NOSTALJII<span class="t-year">2007</span></h1>
        <p class="t-copy">忘れようとしても、思い出せない。</p>
        <div class="t-menu">
          <button id="btn-start" type="button">START</button>
          <button id="btn-continue" type="button" disabled>CONTINUE</button>
        </div>
        <p class="t-note">クリック / タップ / スペースキー で会話を送る</p>
        <p class="t-credit">A PARODY ADVENTURE &nbsp;/&nbsp; NO REAL MEMORY WAS HARMED</p>
      </div>
    </div>

    <!-- ===== 画面効果 ===== -->
    <canvas id="noise"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
  </div>
</div>

<script>
/* =========================================================
   NOSTALJII 2007  ―  scenario
   t: n=地の文 / s=会話 / i=I-CAS / w=待機 / bg / mood / card
      fx / choice / wire / big / save / clear / endcard
   ========================================================= */

const CHARS = {
  kasuke: { name:"カスケ",       fig:"kasuke" },
  illu:   { name:"イリヤ",       fig:"illu"   },
  mash:   { name:"マッシュビー卿", fig:"mash"   },
  dunant: { name:"デュラン",     fig:"dunant" },
  cap:    { name:"船長",         fig:"cap"    },
  voice:  { name:"船内放送",     fig:"voice"  },
  all:    { name:"一同",         fig:"group"  }
};

/* ---- 記憶姿勢の共通ラベル ---- */
const L1 = "覚えている";
const L2 = "覚えていない";
const L3 = "覚えているふり";

const STORY = [

/* =======================================================
   SCENE 1 ― 爆発
   ======================================================= */
{t:"save"},
{t:"bg", v:"sea"},
{t:"mood", v:"sea"},
{t:"card", no:"SCENE 1", ti:"爆　発"},
{t:"n", x:"2007年 7月9日。"},
{t:"n", x:"北大西洋 ―― と、航海日誌には書いてある。"},
{t:"n", x:"豪華客船〈ノスタル爺号〉。乗客三百二十名、乗員百四名。"},
{t:"n", x:"そのうち何人が目的地を知っていたかは、のちに問題となる。"},
{t:"n", x:"午後 二時十四分。"},
{t:"fx", v:"flash"},
{t:"fx", v:"shake"},
{t:"mood", v:"alarm"},
{t:"bg", v:"corridor"},
{t:"n", x:"船底で、何かが爆ぜた。"},
{t:"n", x:"照明が落ち、非常灯が灯る。"},
{t:"n", x:"操舵系、通信設備、いずれも沈黙。"},
{t:"n", x:"そして――スピーカーが、生きていた。"},

{t:"s", who:"voice", x:"「――乗客諸君。聞こえているか」"},
{t:"i", x:"聞こえている。残念ながら。"},
{t:"s", who:"voice", x:"「この船の底には、まだ爆弾がある」"},
{t:"s", who:"voice", x:"「三時間以内に、\"あの日のアレ\"を渡せ。さもなくば船を沈める」"},
{t:"s", who:"kasuke", x:"「……\"あの日のアレ\"とは何だ？」"},
{t:"s", who:"voice", x:"「…………」"},
{t:"s", who:"kasuke", x:"「分からないのか？」"},
{t:"s", who:"voice", x:"「……とにかく探せ」"},
{t:"n", x:"通信が切れた。"},
{t:"i", x:"要求の具体性が、致命的に足りない。"},

/* =========================================================
   3. 音（Web Audio）
   ========================================================= */
const MOODS = {
  sea:    { nz:.055, cut: 380, f1: 55,   f2: 82.5,  dr:.055 },
  dawn:   { nz:.05,  cut: 340, f1: 61.7, f2: 92.5,  dr:.05  },
  alarm:  { nz:.07,  cut: 900, f1: 110,  f2: 116.5, dr:.06  },
  tense:  { nz:.045, cut: 500, f1: 65.4, f2: 98,    dr:.055 },
  illu:   { nz:.035, cut: 620, f1: 73.4, f2: 110,   dr:.05  },
  mash:   { nz:.05,  cut: 300, f1: 61.7, f2: 77.8,  dr:.06  },
  dunant: { nz:.035, cut: 700, f1: 82.4, f2: 123.5, dr:.05  },
  engine: { nz:.075, cut: 240, f1: 41.2, f2: 61.7,  dr:.07  },
  bomb:   { nz:.05,  cut: 420, f1: 49,   f2: 51.9,  dr:.06, tick:true },
  calm:   { nz:.03,  cut: 300, f1: 65.4, f2: 98,    dr:.04  }
};

const Snd = {
  ctx:null, on:true, master:null, noiseGain:null, filt:null,
  o1:null, o2:null, g1:null, tickTimer:null, ready:false,

  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{ this.ctx = new AC(); }catch(e){ return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.on ? .9 : 0;
    this.master.connect(c.destination);

    // brown-ish noise
    const len = c.sampleRate * 3;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      last = (last + .02*w)/1.02; d[i] = last*3.2;
    }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    this.filt = c.createBiquadFilter(); this.filt.type='lowpass'; this.filt.frequency.value=400;
    this.noiseGain = c.createGain(); this.noiseGain.gain.value=.05;
    src.connect(this.filt); this.filt.connect(this.noiseGain); this.noiseGain.connect(this.master);
    src.start();

    this.g1 = c.createGain(); this.g1.gain.value=.05; this.g1.connect(this.master);
    this.o1 = c.createOscillator(); this.o1.type='sine';     this.o1.frequency.value=55;
    this.o2 = c.createOscillator(); this.o2.type='triangle'; this.o2.frequency.value=82.5;
    const g2 = c.createGain(); g2.gain.value=.45;
    this.o1.connect(this.g1); this.o2.connect(g2); g2.connect(this.g1);
    this.o1.start(); this.o2.start();
    this.ready = true;
  },

  resume(){ if(this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },

  mood(name){
    const m = MOODS[name]; if(!m) return;
    if(this.tickTimer){ clearInterval(this.tickTimer); this.tickTimer=null; }
    if(!this.ready) return;
    const t = this.ctx.currentTime, R = (p,v)=>{ p.cancelScheduledValues(t); p.setTargetAtTime(v, t, .8); };
    R(this.filt.frequency, m.cut); R(this.noiseGain.gain, m.nz);
    R(this.o1.frequency, m.f1);    R(this.o2.frequency, m.f2);
    R(this.g1.gain, m.dr);
    if(m.tick) this.tickTimer = setInterval(()=>this.sfx("tick"), 1000);
  },

  sfx(kind){
    if(!this.ready || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    if(kind === "boom"){
      const len = c.sampleRate*2, b = c.createBuffer(1,len,c.sampleRate), d = b.getChannelData(0);
      for(let i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.4); }
      const s = c.createBufferSource(); s.buffer=b;
      const f = c.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(2400,t); f.frequency.exponentialRampToValueAtTime(90, t+1.6);
      const g = c.createGain(); g.gain.setValueAtTime(.95,t); g.gain.exponentialRampToValueAtTime(.001,t+2);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(); s.stop(t+2);
      const o = c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(28,t+1.4);
      const og = c.createGain(); og.gain.setValueAtTime(.6,t); og.gain.exponentialRampToValueAtTime(.001,t+1.6);
      o.connect(og); og.connect(this.master); o.start(); o.stop(t+1.7);
      return;
    }
    const map = { beep:[760,.16,'square',.16], tick:[1500,.045,'square',.05],
                  blip:[280,.02,'square',.022], ok:[520,.5,'sine',.14], cut:[180,.3,'sawtooth',.16] };
    const p = map[kind]; if(!p) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = p[2]; o.frequency.setValueAtTime(p[0], t);
    if(kind==="ok") o.frequency.exponentialRampToValueAtTime(p[0]*1.5, t+p[1]);
    if(kind==="cut") o.frequency.exponentialRampToValueAtTime(40, t+p[1]);
    g.gain.setValueAtTime(p[3], t); g.gain.exponentialRampToValueAtTime(.0008, t+p[1]);
    o.connect(g); g.connect(this.master); o.start(); o.stop(t+p[1]+.05);
  },

  toggle(){
    this.on = !this.on;
    if(this.master) this.master.gain.setTargetAtTime(this.on ? .9 : 0, this.ctx.currentTime, .05);
    return this.on;
  }
};

/* =========================================================
   4. DOM
   ========================================================= */
const $ = s => document.querySelector(s);
const elScreen = $("#screen"), elBg = $("#bg"), elPortrait = $("#portrait"),
      elCard = $("#scene-card"), elIcas = $("#icas"), elIcasBody = $(".icas-body"),
      elMsg = $("#msgwin"), elName = $("#namebox"), elText = $("#msgtext"),
      elCursor = $("#cursor"), elChoices = $("#choices"), elMenu = $("#menu"),
      elFade = $("#fade"), elFlash = $("#flash"), elBig = $("#bigtext"),
      elBigSpan = elBig.querySelector("span"), elTitle = $("#title-screen"),
      btnStart = $("#btn-start"), btnCont = $("#btn-continue"),
      btnSound = $("#btn-sound"), btnTitle = $("#btn-title");

/* =========================================================
   5. 状態
   ========================================================= */
const state = {
  frames: [],
  locked: true,
  awaiting: false,      // クリック待ち
  typing: false,
  typeTimer: null,
  fullText: "",
  target: null,
  checkpoint: null,
  reviveOnContinue: false,
  curBg: "", curMood: "", curFig: "",
  running: false
};

/* =========================================================
   6. 画面制御
   ========================================================= */
/* 画像版素材。読み込めない時は BGS / FIGS の SVG にフォールバック */
const ART_BG  = { sea:1, dawn:1, corridor:1, engine:1, salon:1, smoking:1, library:1 };
const ART_FIG = { illu:1, mash:1, dunant:1, cap:1, voice:1, group:1 };
Object.keys(ART_BG).forEach(k=>{ const i=new Image(); i.src="assets/bg_"+k+".jpg"; });
Object.keys(ART_FIG).forEach(k=>{ const i=new Image(); i.src="assets/fig_"+k+".jpg"; });
/* 明るい背景では胸像の暗い縁が浮くので、人物ごと描いた一枚絵に背景を差し替える */
const SCENE_ART = { "dawn:illu":"bg_dawn_illu" };
Object.keys(SCENE_ART).forEach(k=>{ const i=new Image(); i.src="assets/"+SCENE_ART[k]+".jpg"; });

function setSceneArt(name){
  let ov = elBg.querySelector(".scene-art");
  if(!name){
    if(ov){ ov.classList.remove("on"); window.setTimeout(()=>{ if(ov.parentNode && !ov.classList.contains("on")) ov.remove(); }, 950); }
    return;
  }
  if(!ov){
    ov = document.createElement("img");
    ov.className = "scene-art"; ov.alt = ""; ov.draggable = false;
    elBg.appendChild(ov);
  }
  ov.onerror = ()=>{ ov.remove(); const f = state.curFig; state.curFig = ""; setFig(f, true); };
  ov.src = "assets/"+name+".jpg";
  window.requestAnimationFrame(()=>window.requestAnimationFrame(()=>ov.classList.add("on")));
}

function artImg(holder, src, fallback){
  const img = document.createElement("img");
  img.alt = ""; img.draggable = false;
  img.onerror = ()=>{ holder.classList.remove("art","wide"); holder.innerHTML = fallback; };
  img.src = src;
  holder.innerHTML = "";
  holder.appendChild(img);
}

function setBg(v){
  if(state.curBg === v) return;
  state.curBg = v;
  setFig("");                 /* 場面が変わったら前の人物は退場させる */
  elBg.classList.remove("on");
  window.setTimeout(()=>{
    if(ART_BG[v]) artImg(elBg, "assets/bg_"+v+".jpg", BGS[v]);
    else elBg.innerHTML = BGS[v] || BGS.black;
    const sa = SCENE_ART[state.curBg+":"+state.curFig];
    if(sa) setSceneArt(sa);
    elBg.classList.add("on");
  }, 120);
}

function setFig(fig, noSceneArt){
  if(state.curFig === fig) return;
  state.curFig = fig;
  const sa = noSceneArt ? null : SCENE_ART[state.curBg+":"+fig];
  setSceneArt(sa || null);
  const olds = elPortrait.querySelectorAll(".fig");
  olds.forEach(o=>{
    o.classList.remove("on");
    o.classList.add("gone");
    window.setTimeout(()=>{ if(o.parentNode) o.remove(); }, 560);
  });
  if(!fig || sa) return;
  const d = document.createElement("div");
  d.className = "fig";
  if(ART_FIG[fig]){
    d.classList.add("art");
    if(fig === "group") d.classList.add("wide");
    artImg(d, "assets/fig_"+fig+".jpg", FIGS[fig] || "");
  } else d.innerHTML = FIGS[fig] || "";
  elPortrait.appendChild(d);
  window.requestAnimationFrame(()=>window.requestAnimationFrame(()=>d.classList.add("on")));
}

function shake(hard){
  elScreen.classList.remove("shake","shake-soft");
  void elScreen.offsetWidth;
  elScreen.classList.add(hard ? "shake" : "shake-soft");
}

function flash(){
  elFlash.classList.remove("go"); void elFlash.offsetWidth; elFlash.classList.add("go");
}

/* ---- タイプライター ---- */
function typeInto(target, text, done){
  state.typing = true; state.target = target; state.fullText = text;
  target.textContent = "";
  elCursor.classList.remove("on");
  let i = 0;
  const speed = 26;
  const tick = ()=>{
    if(!state.typing) return;
    if(i >= text.length){
      state.typing = false; state.typeTimer = null;
      elCursor.classList.add("on");
      if(done) done();
      return;
    }
    const ch = text[i++];
    target.textContent += ch;
    if(i % 3 === 0) Snd.sfx("blip");
    let d = speed;
    if("、。」！？…".indexOf(ch) >= 0) d = 210;
    if(ch === "―") d = 60;
    state.typeTimer = window.setTimeout(tick, d);
  };
  state.typeTimer = window.setTimeout(tick, 10);
}

function finishTyping(){
  if(!state.typing) return;
  if(state.typeTimer) clearTimeout(state.typeTimer);
  state.typing = false; state.typeTimer = null;
  state.target.textContent = state.fullText;
  elCursor.classList.add("on");
}

/* =========================================================
   7. 実行エンジン
   ========================================================= */
function pull(){
  while(state.frames.length){
    const f = state.frames[state.frames.length-1];
    if(f.i < f.list.length) return f.list[f.i++];
    state.frames.pop();
  }
  return null;
}

function push(list){ state.frames.push({list:list, i:0}); }

function step(){
  if(!state.running) return;
  const node = pull();
  if(!node){ toTitle(); return; }
  exec(node);
}

function exec(node){
  switch(node.t){

    case "save":
      state.checkpoint = {
        frames: state.frames.map(f=>({list:f.list, i:f.i})),
        bg: state.curBg, mood: state.curMood
      };
      state.reviveOnContinue = false;
      btnCont.disabled = false;
      step(); break;

    case "bg":   setBg(node.v); step(); break;
    case "clear":setFig(""); step(); break;

    case "mood":
      state.curMood = node.v; Snd.mood(node.v); step(); break;

    case "card": {
      state.locked = true;
      setFig("");
      elMsg.classList.remove("on"); elIcas.classList.remove("on"); elMenu.classList.remove("on");
      elCard.querySelector(".sc-no").textContent = node.no;
      elCard.querySelector(".sc-ti").textContent = node.ti;
      elCard.classList.add("on");
      window.setTimeout(()=>{
        elCard.classList.remove("on");
        window.setTimeout(()=>{ state.locked=false; elMenu.classList.add("on"); step(); }, 700);
      }, 2200);
      break; }

    case "n": {
      elMsg.classList.add("on"); elMenu.classList.add("on");
      elName.textContent = "";
      elText.classList.add("narration");
      typeInto(elText, node.x);
      state.awaiting = true;
      break; }

    case "s": {
      const c = CHARS[node.who] || {name:"", fig:""};
      elMsg.classList.add("on"); elMenu.classList.add("on");
      elName.textContent = c.name;
      elText.classList.remove("narration");
      if(node.who !== "kasuke") setFig(c.fig);
      typeInto(elText, node.x);
      state.awaiting = true;
      break; }

    case "i": {
      elIcas.classList.add("on");
      elIcas.classList.remove("glitch"); void elIcas.offsetWidth; elIcas.classList.add("glitch");
      Snd.sfx("tick");
      typeInto(elIcasBody, node.x);
      state.awaiting = true;
      break; }

    case "w":
      state.locked = true; elCursor.classList.remove("on");
      window.setTimeout(()=>{ state.locked=false; step(); }, node.ms||1000);
      break;

    case "fx":
      state.locked = true; elCursor.classList.remove("on");
      runFx(node.v, ()=>{ state.locked=false; step(); });
      break;

    case "choice": showChoice(node); break;
    case "wire":   showWire(); break;

    case "big":
      state.locked = true;
      elBigSpan.textContent = node.x;
      elBig.classList.add("on");
      window.setTimeout(()=>{ state.locked=false; step(); }, node.ms||2500);
      break;

    case "gameover": doGameOver(); break;
    case "endcard":  doEndCard();  break;

    default: step();
  }
}

function runFx(v, done){
  switch(v){
    case "flash": flash(); Snd.sfx("boom"); window.setTimeout(done, 500); break;
    case "shake": shake(true); window.setTimeout(done, 700); break;
    case "beep":  Snd.sfx("beep"); shake(false); window.setTimeout(done, 350); break;
    case "boom":
      flash(); shake(true); Snd.sfx("boom");
      window.setTimeout(()=>{ elFade.classList.remove("fast"); elFade.classList.add("on"); }, 350);
      window.setTimeout(done, 1600); break;
    case "blackout":
      elFade.classList.add("fast"); elFade.classList.add("on");
      window.setTimeout(done, 300); break;
    case "fadeout":
      setFig("");
      elMsg.classList.remove("on"); elIcas.classList.remove("on"); elMenu.classList.remove("on");
      elFade.classList.remove("fast"); elFade.classList.add("on");
      window.setTimeout(done, 1100); break;
    case "fadein":
      elFade.classList.remove("on");
      window.setTimeout(done, 900); break;
    default: done();
  }
}

/* ---- 選択肢 ---- */
function showChoice(node){
  state.locked = true; state.awaiting = false;
  elCursor.classList.remove("on");
  elChoices.className = "on";
  elChoices.innerHTML = "";
  const q = document.createElement("div"); q.className="ch-q"; q.textContent = node.q || "";
  elChoices.appendChild(q);
  node.opts.forEach(op=>{
    const b = document.createElement("button");
    b.type = "button"; b.textContent = op.l;
    b.addEventListener("click", ev=>{
      ev.stopPropagation();
      elChoices.className = ""; elChoices.innerHTML = "";
      Snd.sfx("ok");
      state.locked = false;
      push(op.b);
      step();
    });
    elChoices.appendChild(b);
  });
}

/* ---- 爆弾解除 ---- */
function showWire(){
  state.locked = true; state.awaiting = false;
  elCursor.classList.remove("on");
  elChoices.className = "on wire";
  elChoices.innerHTML = "";
  const q = document.createElement("div");
  q.className = "ch-q"; q.textContent = "― どちらのコードを切る ―";
  elChoices.appendChild(q);
  [["赤いコードを切る", true], ["青いコードを切る", false]].forEach(pair=>{
    const b = document.createElement("button");
    b.type="button"; b.textContent = pair[0];
    b.addEventListener("click", ev=>{
      ev.stopPropagation();
      elChoices.className=""; elChoices.innerHTML="";
      Snd.sfx("cut");
      state.locked=false;
      push(pair[1] ? CUT_RED : BOOM);
      step();
    });
    elChoices.appendChild(b);
  });
}

/* ---- ゲームオーバー（嘘） ---- */
function doGameOver(){
  state.locked = true;
  // BOOM フレームを畳んで、本編は「解除後」の位置に残しておく
  while(state.frames.length && state.frames[state.frames.length-1].list === BOOM) state.frames.pop();
  state.reviveOnContinue = true;
  btnCont.disabled = false;
  elBig.classList.remove("on");
  window.setTimeout(()=>{
    elMsg.classList.remove("on"); elIcas.classList.remove("on"); elMenu.classList.remove("on");
    elChoices.className = "";
    elTitle.classList.remove("off");
    elFade.classList.remove("on");
    state.running = false;
    state.locked = false;
    Snd.mood("calm");
  }, 400);
}

/* ---- エンディング ---- */
function doEndCard(){
  state.locked = true;
  elMsg.classList.remove("on"); elIcas.classList.remove("on"); elMenu.classList.remove("on");
  elBigSpan.innerHTML =
    '<span style="display:block;letter-spacing:.18em;font-size:1.1em;">NOSTALJII 2007</span>' +
    '<span style="display:block;margin-top:1.1em;font-size:.36em;letter-spacing:.24em;font-family:\'Hiragino Mincho ProN\',serif;">忘れようとしても、思い出せない。</span>' +
    '<span style="display:block;margin-top:2.4em;font-size:.3em;letter-spacing:.5em;opacity:.7;">E N D</span>';
  elBigSpan.style.animation = "none";
  elBig.classList.add("on");
  Snd.mood("calm");
  window.setTimeout(()=>{
    state.locked = false;
    const back = ()=>{
      elBig.classList.remove("on");
      elBigSpan.style.animation = "";
      elScreen.removeEventListener("click", back);
      window.setTimeout(toTitle, 400);
    };
    elScreen.addEventListener("click", back);
  }, 2600);
}

function toTitle(){
  state.running = false;
  elMsg.classList.remove("on"); elIcas.classList.remove("on"); elMenu.classList.remove("on");
  elChoices.className = ""; elChoices.innerHTML = "";
  elFade.classList.remove("on"); elBig.classList.remove("on");
  elTitle.classList.remove("off");
  Snd.mood("calm");
}

/* =========================================================
   8. 入力
   ========================================================= */
function advance(){
  if(!state.running || state.locked) return;
  if(state.typing){ finishTyping(); return; }
  if(state.awaiting){ state.awaiting = false; elCursor.classList.remove("on"); step(); }
}

elScreen.addEventListener("click", e=>{
  if(elTitle.classList.contains("off") === false) return;
  if(e.target.closest("#choices") || e.target.closest("#menu")) return;
  advance();
});

document.addEventListener("keydown", e=>{
  if(e.key === " " || e.key === "Enter"){
    if(!elTitle.classList.contains("off")) return;
    e.preventDefault(); advance();
  }
});

/* =========================================================
   9. タイトル／メニュー
   ========================================================= */
function beginRun(){
  Snd.init(); Snd.resume();
  elTitle.classList.add("off");
  state.running = true; state.locked = false; state.awaiting = false;
  window.setTimeout(step, 850);
}

btnStart.addEventListener("click", e=>{
  e.stopPropagation();
  state.frames = [{list:STORY, i:0}];
  state.curBg = ""; state.curFig = ""; state.curMood = "";
  state.reviveOnContinue = false;
  elBg.innerHTML = ""; elPortrait.innerHTML = ""; elIcasBody.textContent = "";
  elFade.classList.remove("on");
  beginRun();
});

btnCont.addEventListener("click", e=>{
  e.stopPropagation();
  if(btnCont.disabled) return;
  if(state.reviveOnContinue){
    state.reviveOnContinue = false;
    elFade.classList.remove("on");
    push(REVIVE);
    beginRun();
    return;
  }
  const cp = state.checkpoint;
  if(!cp) return;
  state.frames = cp.frames.map(f=>({list:f.list, i:f.i}));
  state.curBg = ""; state.curFig = ""; elPortrait.innerHTML = "";
  setBg(cp.bg || "black");
  Snd.mood(cp.mood || "calm");
  elFade.classList.remove("on");
  beginRun();
});

btnSound.addEventListener("click", e=>{
  e.stopPropagation();
  Snd.init();
  const on = Snd.toggle();
  btnSound.textContent = on ? "♪ ON" : "♪ OFF";
});

btnTitle.addEventListener("click", e=>{
  e.stopPropagation();
  if(state.typing) finishTyping();
  toTitle();
});

/* =========================================================
   10. CRT ノイズ
   ========================================================= */
(function noiseLoop(){
  const cv = document.getElementById("noise");
  const W = 160, H = 90;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", {alpha:true});
  const img = ctx.createImageData(W, H);
  let last = 0;
  function draw(ts){
    if(ts - last > 66){
      last = ts;
      const d = img.data;
      for(let i=0;i<d.length;i+=4){
        const v = 90 + Math.random()*165;
        d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]= Math.random()<.55 ? 255 : 70;
      }
      ctx.putImageData(img, 0, 0);
    }
    window.requestAnimationFrame(draw);
  }
  window.requestAnimationFrame(draw);
})();
